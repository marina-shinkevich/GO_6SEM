<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        input { width: 300px; padding: 5px; }
        button { padding: 5px 10px; }
    </style>
</head>
<body>

    <h2>Тестирование WebSocket-сервера</h2>
    <div id="messages"></div>
    
    <input type="text" id="messageInput" placeholder="Введите сообщение...">
    <button onclick="sendMessage()">Отправить</button>

    <script>
        // Подключение к Go WebSocket-серверу
        const socket = new WebSocket("ws://localhost:3001/ws");
        const messagesDiv = document.getElementById("messages");

        // Событие: успешное установление соединения
        socket.onopen = function(e) {
            logMessage("[Система] Соединение установлено");
        };

        // Событие: получение сообщения от сервера
        socket.onmessage = function(event) {
            logMessage(`[Сервер]: ${event.data}`);
        };

        // Событие: закрытие соединения
        socket.onclose = function(event) {
            if (event.wasClean) {
                logMessage(`[Система] Соединение закрыто чисто, код=${event.code}`);
            } else {
                logMessage('[Система] Соединение прервано');
            }
        };

        // Событие: ошибка
        socket.onerror = function(error) {
            logMessage(`[Ошибка]: ${error.message}`);
        };

        // Функция отправки сообщения
        function sendMessage() {
            const input = document.getElementById("messageInput");
            if (input.value) {
                socket.send(input.value);
                logMessage(`[Вы]: ${input.value}`);
                input.value = "";
            }
        }

        // Вспомогательная функция для вывода логов на экран
        function logMessage(message) {
            const messageElement = document.createElement("div");
            messageElement.textContent = message;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Автоскролл вниз
        }
    </script>
</body>
</html>
