server {
    listen 20444 ssl;
    server_name localhost;

    ssl_certificate     certs/localhost+2.pem;
    ssl_certificate_key certs/localhost+2-key.pem;

    # React build (после npm run build)
    root  C:/pr/Course_Project/cosmetic-center-app/build;
    index index.html;

    # SPA fallback — все пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на Node.js (порт 3001)
    location /api/ {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /login и /register тоже на Node.js
    location ~ ^/(login|register|health)$ {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}

