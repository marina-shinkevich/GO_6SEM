    # WebDAV server
    server {
        listen       8080;
        server_name  localhost;

        # Директория для WebDAV
        root         D:\3курс6сем\ПИСда\lapka9\webdav;

        # Включение модуля WebDAV
        dav_methods  PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS;
        dav_access    user:rw group:rw all:r;

        # Создание директорий
        create_full_put_path on;

        # Аутентификация
        auth_basic           "WebDAV Restricted";
        auth_basic_user_file D:\3курс6сем\ПИСда\lapka9\.htpasswd;

        # Разрешить все методы WebDAV
        location / {
            # Разрешить все методы WebDAV
            limit_except GET POST PUT DELETE MKCOL COPY MOVE PROPFIND OPTIONS {
                deny all;
            }
        }

        # Отключить доступ к скрытым файлам
        location ~ /\. {
            deny all;
        }
    }

}
